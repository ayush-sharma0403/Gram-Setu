<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#102133" />
      <stop offset="100%" stop-color="#1C3550" />
    </linearGradient>
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Base background squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  
  <!-- Outer glowing badge -->
  <rect x="56" y="56" width="400" height="400" rx="90" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="4" />
  
  <!-- Inner Turmeric Icon Badge with Drop Shadow -->
  <rect x="96" y="96" width="320" height="320" rx="64" fill="url(#iconGrad)" filter="url(#shadow)" />
  
  <!-- Devanagari Brand Glyph 'ग' for GramSetu -->
  <text x="256" y="325" font-size="220" font-weight="900" font-family="'Noto Sans Devanagari', 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" fill="#102133" text-anchor="middle">ग</text>
  
  <!-- Subtle Civic-Tech Bridge Arc at bottom -->
  <path d="M 160 380 Q 256 345 352 380" stroke="#102133" stroke-width="12" stroke-linecap="round" fill="none" opacity="0.65" />
</svg>
